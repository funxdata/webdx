name: Release (JSR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git branch --show-current || echo "::error::git branch failed"
          git rev-parse --show-toplevel || echo "::error::git rev-parse failed"
          git status --porcelain || echo "::error::git status failed"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./deno.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 deno.json ${version} 不一致" >&2
            exit 1
          fi

      - name: Publish to JSR
        run: npx jsr publish
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
